<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熱帶雨林地理大探險</title>
<style>
body { font-family: sans-serif; background: #1b5e20; margin: 0; padding: 20px; display: flex; justify-content: center; }
.card { background: #fff; width: 100%; max-width: 550px; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.top { background: #104218; color: #fff; padding: 20px; text-align: center; }
.info { background: #e8f5e9; padding: 10px 20px; display: flex; justify-content: space-between; font-weight: bold; color: #1b5e20; }
.main { padding: 25px; }
.btn { background: #2e7d32; color: #fff; border: none; padding: 15px 30px; font-size: 18px; border-radius: 25px; width: 100%; cursor: pointer; margin-top: 15px; }
.opt { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 2px solid #ccc; border-radius: 10px; background: #fff; font-size: 16px; }
.ok { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: bold; }
.no { background: #ffebee; border-color: #c62828; color: #c62828; }
.exp { background: #f1f8e9; padding: 15px; border-radius: 10px; margin-top: 15px; line-height: 1.5; }
</style>
</head>
<body>

<div class="card">
  <div class="top"><h2>🌿 熱帶雨林地理大探險</h2></div>
  <div class="info" id="bar" style="display:none;"><span id="step">第 1 / 6 題</span><span id="pts">得分：0</span></div>
  
  <div class="main" id="p1" style="text-align:center;">
    <div style="font-size:50px;">🦜🌴</div>
    <h3>準備好進入熱帶雨林了嗎？</h3>
    <p>解答 6 個關於雨林氣候、植被與養分循環的問題！</p>
    <button class="btn" id="startBtn">開始探險</button>
  </div>

  <div class="main" id="p2" style="display:none;">
    <div id="topic" style="color:#2e7d32;font-weight:bold;margin-bottom:8px;"></div>
    <h3 id="ques" style="margin-top:0;"></h3>
    <div id="ansBox"></div>
    <div class="exp" id="expBox" style="display:none;"></div>
    <button class="btn" id="nextBtn" style="display:none;">下一題</button>
  </div>

  <div class="main" id="p3" style="display:none;text-align:center;">
    <div style="font-size:50px;">🏆</div>
    <h2>探險完成！</h2>
    <h3 id="finalPts"></h3>
    <button class="btn" id="reBtn">再次挑戰</button>
  </div>
</div>

<script>
var list = [
  { t: "氣候特徵", q: "熱帶雨林氣候最主要的氣候特徵是什麼？", a: ["全年高溫多雨，年溫差小，日溫差較大", "全年乾燥少雨，日夜溫差極大", "夏季高溫多雨，冬季寒冷乾燥", "全年嚴寒，降雪頻繁"], c: 0, e: "赤道地區終年高溫且對流雨旺盛，呈現「日溫差大於年溫差」。" },
  { t: "植被結構", q: "哪一層形成密集的「綠色傘蓋」，截留約 90% 陽光並孕育最多生物？", a: ["林底層", "幼樹層", "林冠層", "突出層"], c: 2, e: "林冠層枝葉緊密交織，是光合作用最旺盛與物種最豐富的「空中走廊」。" },
  { t: "植物適應", q: "高大喬木基部的巨大「板根」主要功能是什麼？", a: ["儲存大量水分備用", "提供額外機械支撐力，穩定淺根系統", "直接從空氣吸收養分", "抵抗森林大火熱能"], c: 1, e: "雨林土壤表層薄，樹木根系較淺，板根能擴大受力面積支撐巨木。" },
  { t: "養分循環", q: "在熱帶雨林生態系統中，絕大部分養分主要儲存在哪裡？", a: ["土壤中", "枯枝落葉層", "地下深層岩石", "活體生物量（樹木與植物體內）"], c: 3, e: "雨林超過 70% 養分儲存在龐大的活體生物量中；枯枝落葉分解極快。" },
  { t: "土壤特徵", q: "磚紅壤通常呈酸性且養分儲存量小，主要原因是什麼？", a: ["強烈降水導致劇烈「淋溶作用」，將養分沖刷至深層", "氣溫太低微生物無法分解落葉", "植物不從土壤吸收礦物質", "火山灰覆蓋土壤"], c: 0, e: "大量雨水下滲引發強烈的淋溶作用，把可溶性養分沖走。" },
  { t: "環境保育", q: "大面積熱帶雨林遭砍伐後，為什麼難以在短時間內自然恢復？", a: ["氣溫驟降至冰點以下", "陽光再也無法照射地面", "失去植被覆蓋後表土易被暴雨沖刷，養分迅速流失", "雨水從此完全消失"], c: 2, e: "砍伐等於直接移走「生物量養分庫」，暴雨沖刷地表導致土地迅速退化。" }
];

var now = 0;
var score = 0;

function runGame() {
  now = 0;
  score = 0;
  document.getElementById("p1").style.display = "none";
  document.getElementById("p3").style.display = "none";
  document.getElementById("p2").style.display = "block";
  document.getElementById("bar").style.display = "flex";
  document.getElementById("pts").innerText = "得分：0";
  loadQ();
}

function loadQ() {
  var item = list[now];
  document.getElementById("step").innerText = "第 " + (now + 1) + " / 6 題";
  document.getElementById("topic").innerText = "主題：" + item.t;
  document.getElementById("ques").innerText = item.q;
  document.getElementById("expBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  
  var box = document.getElementById("ansBox");
  box.innerHTML = "";
  
  for (var i = 0; i < 4; i++) {
    var b = document.createElement("button");
    b.className = "opt";
    b.innerText = item.a[i];
    b.setAttribute("data-idx", i);
    b.onclick = function() {
      var pick = Number(this.getAttribute("data-idx"));
      var btns = box.getElementsByTagName("button");
      for (var k = 0; k < btns.length; k++) {
        btns[k].disabled = true;
      }
      var exp = document.getElementById("expBox");
      if (pick === item.c) {
        this.className = "opt ok";
        score += 100;
        document.getElementById("pts").innerText = "得分：" + score;
        exp.innerHTML = "✅ <b>答對了！</b><br>" + item.e;
      } else {
        this.className = "opt no";
        btns[item.c].className = "opt ok";
        exp.innerHTML = "❌ <b>答錯了！</b><br>" + item.e;
      }
      exp.style.display = "block";
      var nb = document.getElementById("nextBtn");
      nb.style.display = "block";
      nb.innerText = (now === 5) ? "查看成績" : "下一題";
    };
    box.appendChild(b);
  }
}

document.getElementById("startBtn").onclick = runGame;
document.getElementById("reBtn").onclick = runGame;
document.getElementById("nextBtn").onclick = function() {
  now++;
  if (now < 6) {
    loadQ();
  } else {
    document.getElementById("p2").style.display = "none";
    document.getElementById("p3").style.display = "block";
    document.getElementById("finalPts").innerText = "最終得分：" + score + " / 600 分";
  }
};
</script>
</body>
</html>
