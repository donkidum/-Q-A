<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熱帶雨林地理大探險</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1b5e20; color: #1c2822; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
  .box { background: #fff; width: 100%; max-width: 600px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  .hd { background: #104218; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #fbc02d; }
  .bar { display: flex; justify-content: space-between; padding: 12px 20px; background: #e8f5e9; font-weight: bold; color: #1b5e20; }
  .bd { padding: 25px; text-align: center; }
  .q-tag { display: inline-block; background: #e8f5e9; color: #1b5e20; padding: 4px 12px; border-radius: 15px; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  .q-txt { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: left; line-height: 1.4; }
  .opt { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border: 2px solid #cfd8dc; border-radius: 10px; background: #fff; font-size: 16px; cursor: pointer; }
  .opt.ok { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: bold; }
  .opt.no { background: #ffebee; border-color: #c62828; color: #c62828; }
  .fb { display: none; margin-top: 15px; padding: 15px; border-radius: 10px; text-align: left; line-height: 1.5; font-size: 15px; }
  .fb.ok { background: #e8f5e9; color: #1b5e20; border-left: 5px solid #2e7d32; }
  .fb.no { background: #ffebee; color: #b71c1c; border-left: 5px solid #c62828; }
  .btn { background: #2e7d32; color: #fff; border: none; padding: 14px 30px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; margin-top: 15px; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="hd"><h2>🌿 熱帶雨林地理大探險</h2></div>
  <div class="bar hide" id="bar"><span id="cnt">第 1 / 6 題</span><span id="sc">得分：0</span></div>
  <div class="bd" id="s1">
    <div style="font-size:60px;">🦜🌴</div>
    <h3>準備好進入熱帶雨林了嗎？</h3>
    <p style="color:#555;line-height:1.6;">解答 6 個關於雨林氣候、植被結構與養分循環的核心問題！</p>
    <button class="btn" type="button" onclick="go()">開始探險</button>
  </div>
  <div class="bd hide" id="s2" style="text-align:left;">
    <div class="q-tag" id="tag"></div>
    <div class="q-txt" id="qt"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hide" id="nxt" type="button" style="width:100%;" onclick="nxt()">下一題 ➔</button>
  </div>
  <div class="bd hide" id="s3">
    <div style="font-size:60px;">🏆</div>
    <h2>探險完成！</h2>
    <p style="font-size:22px;">最終得分：<strong id="fsc" style="color:#1b5e20;">0</strong> / 600 分</p>
    <button class="btn" type="button" onclick="go()">再次挑戰 🔄</button>
  </div>
</div>
<script>
const data = [
  { t:"氣候特徵", q:"熱帶雨林氣候最主要的氣候特徵是什麼？", o:["全年高溫多雨，年溫差小，日溫差較大","全年乾燥少雨，日夜溫差極大","夏季高溫多雨，冬季寒冷乾燥","全年嚴寒，降雪頻繁"], c:0, e:"赤道地區終年高溫且對流雨旺盛，日夜變化比四季明顯，呈現「日溫差大於年溫差」。" },
  { t:"植被垂直結構", q:"哪一層形成密集的「綠色傘蓋」，截留約 90% 陽光並孕育最多生物？", o:["林底層","幼樹層","林冠層","突出層"], c:2, e:"林冠層高度約 30 至 40 米，枝葉緊密交織，是光合作用最旺盛與物種最豐富的「空中走廊」。" },
  { t:"植物適應構造", q:"高大喬木基部的巨大「板根」（Buttress roots）主要功能是什麼？", o:["儲存大量水分備用","提供額外機械支撐力，穩定淺根系統","直接從空氣吸收養分","抵抗森林大火熱能"], c:1, e:"雨林土壤表層薄，樹木根系較淺，板根能擴大受力面積，支撐巨木不致傾倒。" },
  { t:"養分循環", q:"在熱帶雨林生態系統中，絕大部分養分主要儲存在哪一個庫中？", o:["土壤中","枯枝落葉層","地下深層岩石","活體生物量（樹木與植物體內）"], c:3, e:"雨林超過 70% 養分儲存在龐大的活體生物量中；枯枝落葉分解極快且迅速被吸收。" },
  { t:"土壤與淋溶作用", q:"磚紅壤（Latosol）通常呈酸性且養分儲存量小，主要原因是什麼？", o:["強烈降水導致劇烈「淋溶作用」，將養分沖刷至深層","氣溫太低微生物無法分解落葉","植物不從土壤吸收礦物質","火山灰覆蓋土壤"], c:0, e:"大量雨水下滲引發強烈的淋溶作用，把可溶性養分沖走，加上植物大量吸收，使土壤養分變小。" },
  { t:"環境保育", q:"大面積熱帶雨林遭砍伐後，為什麼難以在短時間內自然恢復原貌？", o:["氣溫驟降至冰點以下","陽光再也無法照射地面","失去植被覆蓋後表土易被暴雨沖刷，養分迅速流失","雨水從此完全消失"], c:2, e:"砍伐等於直接移走「生物量養分庫」，失去樹冠截留後暴雨沖刷地表，導致土地迅速貧瘠退化。" }
];
let idx = 0, score = 0;
function go() {
  idx = 0; score = 0;
  document.getElementById('s1').classList.add('hide');
  document.getElementById('s3').classList.add('hide');
  document.getElementById('s2').classList.remove('hide');
  document.getElementById('bar').classList.remove('hide');
  document.getElementById('sc').innerText = '得分：0';
  show();
}
function show() {
  const d = data[idx];
  document.getElementById('cnt').innerText = '第 ' + (idx+1) + ' / 6 題';
  document.getElementById('tag').innerText = '📌 ' + d.t;
  document.getElementById('qt').innerText = d.q;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  document.getElementById('fb').style.display = 'none';
  document.getElementById('nxt').classList.add('hide');
  d.o.forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.innerText = String.fromCharCode(65+i) + '. ' + txt;
    b.onclick = function() { pick(i, b); };
    opts.appendChild(b);
  });
}
function pick(i, btn) {
  const d = data[idx];
  const all = document.querySelectorAll('.opt');
  all.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (i === d.c) {
    btn.classList.add('ok'); score += 100;
    document.getElementById('sc').innerText = '得分：' + score;
    fb.className = 'fb ok'; fb.innerHTML = '<b>✅ 回答正確！</b><br>' + d.e;
  } else {
    btn.classList.add('no'); all[d.c].classList.add('ok');
    fb.className = 'fb no'; fb.innerHTML = '<b>❌ 答錯了！</b><br>' + d.e;
  }
  fb.style.display = 'block';
  const nb = document.getElementById('nxt');
  nb.classList.remove('hide');
  nb.innerText = idx === 5 ? '查看成績 🏆' : '下一題 ➔';
}
function nxt() {
  idx++;
  if (idx < 6) show();
  else {
    document.getElementById('s2').classList.add('hide');
    document.getElementById('s3').classList.remove('hide');
    document.getElementById('fsc').innerText = score;
  }
}
</script>
</body>
</html>
